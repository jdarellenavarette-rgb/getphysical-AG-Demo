# Supabase CLI project config (local dev: `supabase start`, deploy: `supabase db push`
# and `supabase functions deploy`). See docs/BACKEND.md.
project_id = "getphysical"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm", "http://localhost:3000/auth/callback", "sodia://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.rate_limit]
email_sent = 4
sms_sent = 30
sign_in_sign_ups = 30
token_verifications = 30

# Mobile-number sign-in (the app's primary method). Codes are sent by an SMS
# provider; its credentials come from the environment (never commit them):
#   SUPABASE_AUTH_SMS_TWILIO_ACCOUNT_SID / _MESSAGE_SERVICE_SID / _AUTH_TOKEN
# Any provider Supabase supports works (Twilio, Twilio Verify, MessageBird, Vonage, Textlocal).
[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your GetPhysical code is {{ .Code }}. It expires in 10 minutes."
max_frequency = "60s"

[auth.sms.twilio]
enabled = true
account_sid = "env(SUPABASE_AUTH_SMS_TWILIO_ACCOUNT_SID)"
message_service_sid = "env(SUPABASE_AUTH_SMS_TWILIO_MESSAGE_SERVICE_SID)"
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# Social sign-in. Secrets come from the environment (never commit them):
#   SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID / _SECRET, SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID / _SECRET
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[auth.external.apple]
enabled = true
# Comma-separated: the web Services ID first, then the iOS bundle ID (com.getphysical.sodia) for native sign-in.
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

[functions.nutrition-parse]
verify_jwt = true

[functions.payments-checkout]
verify_jwt = true

# Payment providers cannot send Supabase JWTs; these verify their own signatures.
[functions.webhook-xendit]
verify_jwt = false

[functions.webhook-stripe]
verify_jwt = false

[functions.webhook-maya]
verify_jwt = false
